name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm ci --ignore-scripts
        working-directory: examples/claim-ui
      - run: npx svelte-check --tsconfig ./tsconfig.json && npx tsc -p tsconfig.node.json && npx vite build
        working-directory: examples/claim-ui
